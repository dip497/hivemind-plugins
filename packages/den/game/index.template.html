<title>Den</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700&display=swap">
<style>
/* Layout: the clearing fills the screen; a few soft chips sit at its edges, a drawer slides up for tuning. */
:root {
  --sky-top: #a7c7d3;
  --sky-low: #dbe6d3;
  --chip: rgba(251, 247, 238, 0.86);
  --chip-line: rgba(64, 58, 40, 0.14);
  --ink: #2a2a20;
  --ink-soft: #5d5a49;
  --accent: #b9672c;
  --track: #d9d1bd;
  --font-display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --font-ui: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chip: rgba(30, 33, 26, 0.84);
    --chip-line: rgba(235, 228, 205, 0.16);
    --ink: #f1ecdc;
    --ink-soft: #c4bea9;
    --accent: #e39a5b;
    --track: #4d4c3f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chip: rgba(30, 33, 26, 0.84);
  --chip-line: rgba(235, 228, 205, 0.16);
  --ink: #f1ecdc;
  --ink-soft: #c4bea9;
  --accent: #e39a5b;
  --track: #4d4c3f;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 62%, var(--sky-low) 100%);
  color: var(--ink);
  font: 500 15px/1.4 var(--font-ui);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chip {
  background: var(--chip);
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 10px rgba(40, 40, 20, 0.08);
}
.top {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 6px 14px 7px; }
.brand b { font: 800 22px/1 var(--font-display); letter-spacing: 0.01em; color: var(--ink); }
.brand small { font: 700 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.buttons { display: flex; gap: 8px; }
button {
  font: 700 14px/1 var(--font-ui);
  color: var(--ink);
  padding: 10px 14px;
  min-height: 40px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button svg { width: 18px; height: 18px; flex: none; }
#sound[aria-pressed="false"] .wave { display: none; }
#sound[aria-pressed="true"] .slash { display: none; }
.bottom {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#hint { padding: 10px 18px; font-weight: 700; text-align: center; max-width: 100%; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; padding: 8px 16px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.stats strong { color: var(--ink); font-weight: 700; }
#bubble {
  position: fixed; left: 0; top: 0;
  padding: 7px 14px;
  font: 800 17px/1 var(--font-display);
  color: var(--ink);
  pointer-events: none;
  white-space: nowrap;
}
#tune {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(64px + env(safe-area-inset-top, 0px));
  width: min(340px, calc(100vw - 32px));
  max-height: calc(100% - 140px);
  overflow: auto;
  border-radius: 18px;
  padding: 14px 16px 16px;
  display: grid; gap: 12px;
}
#tune h2 { margin: 0; font: 800 18px/1.1 var(--font-display); }
#tune p { margin: 0; color: var(--ink-soft); font-size: 13px; }
.tune-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tune-head button { padding: 8px 12px; min-height: 34px; }
#tune-list { display: grid; gap: 12px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: baseline; }
.slider-name { font-weight: 700; font-size: 14px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13px; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.tune-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tune-actions button { border-radius: 999px; }
#tune-text { width: 100%; box-sizing: border-box; font: 500 12px/1.4 var(--font-ui); color: var(--ink); background: transparent; border: 1px solid var(--chip-line); border-radius: 10px; padding: 8px; resize: none; }
#loading {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  font: 800 22px/1 var(--font-display);
  color: var(--ink);
  pointer-events: none;
}
@media (max-width: 520px) {
  body.tuning .bottom { display: none; }
  .brand small { display: none; }
  button span.label-wide { display: none; }
  #tune { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-height: 70%; }
  #hint { font-size: 14px; }
}
</style>
<canvas id="stage" aria-label="A wolf pup in a forest clearing. Press it to pick it up, flick to toss it."></canvas>
<div class="top">
  <div class="brand chip"><b>Den</b><small>Feel test</small></div>
  <div class="buttons">
    <button id="sound" class="chip" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
      <span>Sound on</span>
    </button>
    <button id="tune-open" class="chip" type="button" aria-expanded="false" aria-controls="tune">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Tune</span>
    </button>
  </div>
</div>
<section id="tune" class="chip" hidden aria-label="Tune the feel">
  <div class="tune-head"><h2>Tune the feel</h2><button id="tune-close" class="chip" type="button">Done</button></div>
  <p>Changes apply to the next toss. They are kept in this browser.</p>
  <div id="tune-list"></div>
  <div class="tune-actions">
    <button id="tune-copy" class="chip" type="button">Copy settings</button>
    <button id="tune-reset" class="chip" type="button">Reset</button>
  </div>
  <textarea id="tune-text" rows="3" readonly hidden aria-label="Settings to copy"></textarea>
</section>
<div class="bottom">
  <div id="hint" class="chip" role="status" aria-live="polite"></div>
  <div class="stats chip" aria-live="off">
    <span>Last toss <strong id="stat-last">–</strong></span>
    <span>Caught in a row <strong id="stat-row">0</strong></span>
    <span>Best <strong id="stat-best">0</strong></span>
  </div>
</div>
<div id="bubble" class="chip" hidden></div>
<div id="loading">Waking the pup…</div>
<script type="module">
/*BUNDLE*/
</script>
