<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archipelago</title>
  <link rel="stylesheet" href="./archipelago.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="stage" aria-hidden="true"></div>
  <div class="labels" aria-hidden="true"></div>
  <div class="edges"></div>
  <header class="head">
    <h1>Archipelago</h1>
    <p class="sum" aria-live="polite"></p>
  </header>
  <section class="calls" aria-label="Agents calling you" hidden>
    <h2><button type="button" class="calls-toggle" aria-expanded="false" aria-controls="calls-list"><span class="dot"></span><span class="calls-title">Calling you</span></button><kbd title="Next agent calling you">N</kbd></h2>
    <ol class="calls-list" id="calls-list"></ol>
  </section>
  <section class="card" hidden aria-live="polite"></section>
  <div class="dock" aria-hidden="true"></div>
  <!-- The app's toolbar is off over this view ("toolbar": "off"): this is its own, as a plank of the dock. -->
  <nav class="bar" aria-label="Archipelago tools">
    <div class="grp">
      <button type="button" class="btn start" aria-haspopup="menu" aria-expanded="false" title="Start an agent on the island you are looking at">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Start an agent</span>
      </button>
      <button type="button" class="btn new-island" title="Found a new island: a project, from a folder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0"/><path d="M6 14c1-4 4-6 6-6s5 2 6 6"/><path d="M12 8V4l3 1.5L12 7"/></svg><span>New island</span>
      </button>
    </div>
    <div class="grp">
      <button type="button" class="btn icon overview" title="See every island (Home)" aria-label="See every island">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button type="button" class="btn icon walk" aria-pressed="false" title="Walk the islands yourself (J)" aria-label="Walk the islands">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M11 8l-1 5"/></svg>
      </button>
      <button type="button" class="btn icon next" title="Go to the next agent calling you (N)" aria-label="Next agent calling you" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b class="count" hidden></b>
      </button>
      <button type="button" class="btn icon sound" aria-pressed="false" title="Sounds when an agent calls you or finishes a turn" aria-label="Sounds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div class="grp host" hidden>
      <button type="button" class="btn icon add" title="Add a widget or a tool" aria-label="Add a widget or a tool">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 4v7M13 7.5h7"/></svg>
      </button>
      <button type="button" class="btn icon theme" title="Appearance" aria-label="Appearance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-1.3-1-1.4-1-2.6 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg>
      </button>
      <button type="button" class="btn views" aria-haspopup="menu" title="Switch view (⌘E)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15c2 1.3 4 1.3 6 0s4-1.3 6 0 4 1.3 6 0"/><path d="M7 12l2.5-5 2.5 5M13 12l2-3.5L17 12"/></svg><span>Archipelago</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg>
      </button>
    </div>
  </nav>
  <div class="menu crew" role="menu" aria-label="Start an agent" hidden></div>
  <div class="toast" role="status" hidden></div>
  <div class="tip" hidden></div>
  <!-- While you walk: the switch to your worker's own eyes, and what you can do here. -->
  <div class="walking" hidden>
    <button type="button" class="pov" role="switch" aria-checked="false" aria-keyshortcuts="V" title="See through your worker's eyes, or from behind it (V)"><span class="knob" aria-hidden="true"></span>Through your eyes<kbd aria-hidden="true">V</kbd></button>
    <p class="walk-hint" aria-live="polite"></p>
  </div>
  <div class="sr" aria-live="assertive"></div>
  <script type="module" src="./archipelago.js"></script>
</body>
</html>
