# Merging is publishing: every agent, widget, tool and view folder a push to main changes is
# published to HiveHub at that commit, once the tests pass, so installed copies update on their
# next launch without a manual step.
name: publish
on:
  push:
    branches: [main]
    paths: ["agents/**", "widgets/**", "tools/**", "views/**"]
  workflow_dispatch:
    inputs:
      plugins:
        description: "folders to publish, space-separated, like agents/amp widgets/dog tools/ci-runs views/timeline (default: all)"
        required: false
permissions:
  contents: read
concurrency: publish
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # HiveHub checks GitHub's signed proof that this job runs in this repository on main.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Folders to publish
        id: which
        env:
          CHOSEN: ${{ inputs.plugins }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            dirs="$CHOSEN"
            [ -z "$dirs" ] && dirs=$(ls -d agents/* widgets/* tools/* views/*)
          else
            dirs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- agents widgets tools views | cut -d/ -f1-2 | sort -u)
          fi
          # The folder HiveHub lists for each: a view written in TypeScript is listed from its build.
          # A deleted folder, or one with no manifest, has nothing to publish.
          paths=""
          for d in $dirs; do
            d=${d%/}
            case "$d" in agents/*|widgets/*|tools/*|views/*) ;; *) echo "::error::$d is not a plugin folder"; exit 1 ;; esac
            if [ -f "$d/dist/hivemind-view.json" ]; then paths="$paths $d/dist"
            elif [ -f "$d/agent.yaml" ] || [ -f "$d/widget.json" ] || [ -f "$d/hivemind-tool.json" ] || [ -f "$d/hivemind-view.json" ]; then paths="$paths $d"
            fi
          done
          paths=$(echo $paths | xargs)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "publishing: ${paths:-nothing}"
      - name: Publish
        if: steps.which.outputs.paths != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.which.outputs.paths }}
        run: |
          oidc=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hivehub" | jq -r .value)
          fail=0
          for p in $PATHS; do
            body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg path "$p" '{repo:$repo, path:$path, confirm:true}')
            out=$(curl -sS -X POST https://hivehub.griiken.workers.dev/api/publish \
              -H "Authorization: Bearer $oidc" -H "X-GitHub-Token: $GH_TOKEN" -H "content-type: application/json" -d "$body")
            if echo "$out" | jq -e '.published' >/dev/null; then echo "published $p as $(echo "$out" | jq -r .published)"
            else echo "::error::$p: $(echo "$out" | jq -r '.error // .')"; fail=1; fi
          done
          exit $fail
