# Merging is publishing: every agent, widget, tool, view and package folder a push to main changes
# is published to HiveHub at that commit, once the tests pass, so installed copies update on their
# next launch without a manual step.
name: publish
on:
  push:
    branches: [main]
    paths: ["agents/**", "widgets/**", "tools/**", "views/**", "packages/**"]
  workflow_dispatch:
    inputs:
      plugins:
        description: "folders to publish, space-separated, like agents/amp widgets/dog tools/ci-runs views/timeline packages/archipelago (default: all)"
        required: false
permissions:
  contents: read
concurrency: publish
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # HiveHub checks GitHub's signed proof that this job runs in this repository on main.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Folders to publish
        id: which
        env:
          CHOSEN: ${{ inputs.plugins }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            dirs="$CHOSEN"
            [ -z "$dirs" ] && dirs=$(ls -d agents/* widgets/* tools/* views/* packages/*)
          else
            dirs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- agents widgets tools views packages | cut -d/ -f1-2 | sort -u)
          fi
          # The folder HiveHub lists for each: a view written in TypeScript is listed from its build,
          # a package from its own folder, which says which of its files install. A package of the
          # old format (review-room, an inspection prototype) is not one HiveHub lists. A deleted
          # folder, or one with no manifest, has nothing to publish.
          paths=""
          for d in $dirs; do
            d=${d%/}
            case "$d" in agents/*|widgets/*|tools/*|views/*|packages/*) ;; *) echo "::error::$d is not a plugin folder"; exit 1 ;; esac
            if [ -f "$d/hivemind-package.json" ]; then jq -e '.apiVersion == 2' "$d/hivemind-package.json" >/dev/null && paths="$paths $d"
            elif [ -f "$d/dist/hivemind-view.json" ]; then paths="$paths $d/dist"
            elif [ -f "$d/agent.yaml" ] || [ -f "$d/widget.json" ] || [ -f "$d/hivemind-tool.json" ] || [ -f "$d/hivemind-view.json" ]; then paths="$paths $d"
            fi
          done
          paths=$(echo $paths | xargs)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "publishing: ${paths:-nothing}"
      - name: Publish
        if: steps.which.outputs.paths != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.which.outputs.paths }}
        run: |
          fail=0
          for p in $PATHS; do
            oidc=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hivehub" | jq -r .value)
            # A large folder is read over several calls: each answer but the last is a reading to
            # send back. It is kept in a file, as it can be larger than one argument may be.
            echo null > reading.json
            for step in $(seq 30); do
              jq -n --arg repo "$GITHUB_REPOSITORY" --arg path "$p" --slurpfile reading reading.json \
                '{repo:$repo, path:$path, confirm:true, steps:true} + (if $reading[0] then {reading:$reading[0]} else {} end)' > body.json
              # A request that fails (a dropped connection, a timeout) fails this folder, not the rest. The
              # answer goes to a file, which a retry starts again; on stdout it would follow the failure's.
              curl -sS --retry 2 -o answer.json -X POST https://hivehub.griiken.workers.dev/api/publish \
                -H "Authorization: Bearer $oidc" -H "X-GitHub-Token: $GH_TOKEN" -H "content-type: application/json" -d @body.json \
                || { echo "::error::$p: the request to HiveHub failed"; fail=1; break; }
              out=$(cat answer.json)
              if echo "$out" | jq -e 'has("read")' >/dev/null 2>&1; then
                echo "$p: read $(echo "$out" | jq -r .read) of $(echo "$out" | jq -r .of) files"
                echo "$out" | jq .reading > reading.json
              elif echo "$out" | jq -e '.published' >/dev/null 2>&1; then echo "published $p as $(echo "$out" | jq -r .published)"; break
              else echo "::error::$p: $(echo "$out" | jq -r '.error // .' 2>/dev/null || echo "$out")"; fail=1; break; fi
            done
            [ "$step" = 30 ] && ! echo "$out" | jq -e '.published' >/dev/null 2>&1 && { echo "::error::$p: still reading after 30 calls"; fail=1; }
          done
          exit $fail
