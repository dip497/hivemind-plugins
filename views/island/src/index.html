<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Island</title>
  <link rel="stylesheet" href="./island.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="stage" aria-hidden="true"></div>
  <div class="labels" aria-hidden="true"></div>
  <div class="edges"></div>
  <header class="head">
    <h1>Island</h1>
    <p class="sum" aria-live="polite"></p>
  </header>
  <section class="calls" aria-label="Agents calling you" hidden>
    <h2><span class="dot"></span><span class="calls-title">Calling you</span><kbd title="Next agent calling you">N</kbd></h2>
    <ol class="calls-list"></ol>
  </section>
  <section class="card" hidden aria-live="polite"></section>
  <div class="dock" aria-hidden="true"></div>
  <div class="tools">
    <button type="button" class="tool overview" title="See every island (Home)" aria-label="See every island">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button type="button" class="tool sound" aria-pressed="false" title="Sounds when an agent calls you or finishes a turn" aria-label="Sounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
  <div class="toast" role="status" hidden></div>
  <div class="tip" hidden></div>
  <div class="sr" aria-live="assertive"></div>
  <script type="module" src="./island.js"></script>
</body>
</html>
